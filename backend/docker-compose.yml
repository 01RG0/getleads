# Self-hosted deployment — works on any VPS (DigitalOcean, Hetzner, Linode, Oracle Cloud free tier)
# Usage: docker compose up -d
version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadscale-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    env_file:
      - .env
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - leadscale

  # Local Redis — ONLY use this if you are NOT using Upstash
  # Comment this out and use REDIS_URL=redis://... pointing to Upstash instead
  redis:
    image: redis:7-alpine
    container_name: leadscale-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leadscale

  # Optional: BullMQ dashboard (Bull Board)
  bullboard:
    image: deadly0/bull-board:latest
    container_name: leadscale-bullboard
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
    depends_on:
      - redis
    networks:
      - leadscale
    profiles:
      - debug   # only starts with: docker compose --profile debug up

volumes:
  redis_data:

networks:
  leadscale:
    driver: bridge
