# Fly.io deployment config — https://fly.io/docs/reference/configuration/
app = "leadscale-backend"
primary_region = "iad"   # Change to closest region: iad/lhr/fra/sin/syd

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  NODE_ENV = "production"
  PORT = "3001"

# Set secrets with: fly secrets set DATABASE_URL="..." UPSTASH_REDIS_REST_URL="..."
# Required secrets: DATABASE_URL, DIRECT_URL, UPSTASH_REDIS_REST_URL,
#                   UPSTASH_REDIS_REST_TOKEN, REDIS_URL, API_SECRET_KEY, CORS_ORIGIN
