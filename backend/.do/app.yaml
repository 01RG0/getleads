# DigitalOcean App Platform — https://docs.digitalocean.com/products/app-platform/
name: leadscale-backend
region: nyc

services:
  - name: api
    dockerfile_path: Dockerfile
    github:
      repo: your-org/getleads
      branch: main
      deploy_on_push: true
    source_dir: /backend
    http_port: 3001
    instance_count: 1
    instance_size_slug: basic-xxs   # upgrade to basic-xs for production
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: PORT
        value: "3001"
        scope: RUN_TIME
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DIRECT_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_URL
        scope: RUN_TIME
        type: SECRET
      - key: UPSTASH_REDIS_REST_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
      - key: API_SECRET_KEY
        scope: RUN_TIME
        type: SECRET
      - key: CORS_ORIGIN
        scope: RUN_TIME
        type: SECRET
